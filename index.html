        const Navbar = ({ lang, setLang, t }) => {

                            <a href="https://drive.google.com/file/d/1g0QLk5X0iVHT6ocU8TfEqbkOS-xsR3wm/view?usp=sharing" target="_blank" rel="noopener noreferrer" className="bg-cyan-400 text-void font-bold px-5 py-2 rounded-sm hover:bg-cyan-500 transition-colors hover:shadow-neon text-sm font-heading">

                    {mobileMenuOpen && (

                            <div className="flex gap-2 pt-2">
                                <button onClick={() => setLang('en')} className={`flag-btn p-1 ${lang === 'en' ? 'active' : ''}`} title="English">
                                    <img src="https://flagcdn.com/w40/gb.png" alt="UK" className="w-6 h-4 object-cover rounded-[2px]" />
                                </button>
                                <button onClick={() => setLang('id')} className={`flag-btn p-1 ${lang === 'id' ? 'active' : ''}`} title="Indonesia">

                    )}
                </nav>
            );
        };

        const Hero = ({ t }) => {
            const [text, setText] = useState("");
            const [isDeleting, setIsDeleting] = useState(false);
            const [loopNum, setLoopNum] = useState(0);
            const [delta, setDelta] = useState(150);
            
            const roles = ["Junior Web Developer", "Tech Enthusiast", "Creative Problem Solver"];
            const canvasRef = useRef(null);

            useEffect(() => {
                let ticker = setInterval(() => tick(), delta);
                return () => clearInterval(ticker);
            }, [text, delta]);

            const tick = () => {
                let i = loopNum % roles.length;
                let fullText = roles[i];
                let updatedText = isDeleting ? fullText.substring(0, text.length - 1) : fullText.substring(0, text.length + 1);
                setText(updatedText);
                if (isDeleting) setDelta(50);
                if (!isDeleting && updatedText === fullText) {
                    setIsDeleting(true);
                    setDelta(2000); 
                } else if (isDeleting && updatedText === '') {
                    setIsDeleting(false);
                    setLoopNum(loopNum + 1);
                    setDelta(150);
                }
            };

            // Canvas Logic
            useEffect(() => {
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                let animationFrameId;
                let particles = [];
                let mouse = { x: null, y: null };

                const resize = () => {
                    canvas.width = window.innerWidth;
                    canvas.height = window.innerHeight;
                    initParticles();
                };

                // Debounced resize: re-init particles at most once per 150ms
                let resizeTimer = null;
                const onResize = () => {
                    clearTimeout(resizeTimer);
                    resizeTimer = setTimeout(resize, 150);
                };

                class Particle {
                    constructor() {
                        this.x = Math.random() * canvas.width;
                        this.y = Math.random() * canvas.height;
                        this.vx = (Math.random() - 0.5) * 0.3;
                        this.vy = (Math.random() - 0.5) * 0.3;
                        this.size = Math.random() * 2 + 1;
                        this.color = Math.random() > 0.8 ? '#ffffff' : '#00F0FF';
                        this.baseX = this.x;
                        this.baseY = this.y;
                    }

                    update() {
                        this.x += this.vx;
                        this.y += this.vy;

                        if (mouse.x != null) {
                            let dx = mouse.x - this.x;
                            let dy = mouse.y - this.y;
                            let distance = Math.sqrt(dx * dx + dy * dy);
                            let maxDistance = 150;
                            if (distance < maxDistance) {
                                let force = (maxDistance - distance) / maxDistance;
                                this.x -= (dx / distance) * force * 2;
                                this.y -= (dy / distance) * force * 2;
                            }
                        }

                        if (this.x < 0) this.x = canvas.width;
                        if (this.x > canvas.width) this.x = 0;
                        if (this.y < 0) this.y = canvas.height;
                        if (this.y > canvas.height) this.y = 0;
                    }

                    draw() {
                        ctx.beginPath();
                        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                        ctx.fillStyle = this.color;
                        ctx.shadowBlur = 10;
                        ctx.shadowColor = this.color;
                        ctx.fill();
                        ctx.shadowBlur = 0;
                    }
                }

                function initParticles() {
                    particles = [];
                    // Cap density on small screens: O(n^2) link pass stays cheap on mobile
                    const divisor = window.innerWidth < 768 ? 30000 : 15000;
                    let numberOfParticles = (canvas.width * canvas.height) / divisor;
                    for (let i = 0; i < numberOfParticles; i++) {
                        particles.push(new Particle());
                    }
                }

                function animate() {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    for (let a = 0; a < particles.length; a++) {
                        for (let b = a; b < particles.length; b++) {
                            let dx = particles[a].x - particles[b].x;
                            let dy = particles[a].y - particles[b].y;
                            let distance = Math.sqrt(dx * dx + dy * dy);

                            if (distance < 120) {
                                ctx.beginPath();
                                let opacityValue = 1 - (distance / 120);
                                ctx.strokeStyle = 'rgba(0, 240, 255,' + opacityValue * 0.3 + ')';
                                ctx.lineWidth = 0.5;
                                ctx.moveTo(particles[a].x, particles[a].y);
                                ctx.lineTo(particles[b].x, particles[b].y);
                                ctx.stroke();
                            }
                        }
                    }
                    particles.forEach(p => { p.update(); p.draw(); });
                    animationFrameId = requestAnimationFrame(animate);
                }

                const onMouseMove = (e) => { mouse.x = e.x; mouse.y = e.y; };
                window.addEventListener('resize', onResize);
                window.addEventListener('mousemove', onMouseMove, { passive: true });
                resize();
                animate();

                return () => {
                    window.removeEventListener('resize', onResize);
                    window.removeEventListener('mousemove', onMouseMove);
                    cancelAnimationFrame(animationFrameId);
                };
            }, []);

            return (
                <section id="home" className="relative min-h-screen flex items-center justify-center overflow-hidden">
                    <div className="absolute inset-0 z-0 bg-void">
                        <canvas ref={canvasRef} className="absolute inset-0 block w-full h-full"></canvas>
                        <div className="absolute bottom-0 left-0 w-full h-[30vh] perspective-grid opacity-30 pointer-events-none"></div>
                        <div className="absolute inset-0 bg-[radial-gradient(circle_at_center,transparent_0%,#050b14_100%)] opacity-80 pointer-events-none"></div>
                    </div>
                    <div className="relative z-10 max-w-4xl mx-auto px-6 text-center space-y-8 animate-fade-up">
                        <div className="inline-block mb-2">
                            <span className="px-4 py-1.5 rounded-full border border-cyan-500/30 bg-cyan-900/10 text-cyan-400 font-mono text-sm tracking-widest uppercase shadow-neon">
                                {t.hero.greeting}
                            </span>
                        </div>
                        <h1 className="text-6xl md:text-8xl font-heading font-bold leading-tight tracking-tighter text-white drop-shadow-2xl">
                             {t.hero.im} 
                            <span className="bg-clip-text text-transparent bg-gradient-to-r from-white via-cyan-100 to-white animate-pulse">
                                 Diki Alif Taufik
                            </span>
                        </h1>
                        <div className="h-12 flex items-center justify-center text-2xl md:text-3xl font-mono text-cyan-400">
                            <span className="mr-3 opacity-50">{'>'}</span>
                            <span className="font-bold border-r-2 border-cyan-400 pr-1 animate-pulse">{text}</span>
                        </div>
                        <p className="text-lg md:text-xl text-neutral-300 max-w-2xl mx-auto leading-relaxed drop-shadow-md">
                            {t.hero.subPitch}
                        </p>
                        <div className="flex flex-col sm:flex-row justify-center gap-6 pt-8">
                            <button onClick={() => document.getElementById('showcase').scrollIntoView({behavior: 'smooth'})} 
                                className="px-10 py-4 bg-cyan-400 text-void font-bold rounded-sm hover:bg-cyan-300 hover:shadow-neon transition-all hover:-translate-y-1 tracking-wide">
                                {t.hero.btnPrimary}
                            </button>
                            <button onClick={() => document.getElementById('contact').scrollIntoView({behavior: 'smooth'})} 
                                className="px-10 py-4 bg-transparent border border-white/20 text-white font-bold rounded-sm hover:border-cyan-400 hover:text-cyan-400 hover:bg-white/5 transition-all tracking-wide backdrop-blur-sm">
                                {t.hero.btnSecondary}
                            </button>
                        </div>
                    </div>
                    <div className="absolute bottom-10 left-1/2 -translate-x-1/2 text-white/50 animate-bounce">
                        <Icon name="chevrons-down" size={24} />
                    </div>
                </section>
            );
        };

        const Chatbot = ({ t }) => {
            const [messages, setMessages] = useState([
                { sender: 'bot', text: "Hi there! I'm Diki's AI assistant. I'm here to answer any questions you have about my background!" }
            ]);
            const [input, setInput] = useState("");
            const [isTyping, setIsTyping] = useState(false);
            const chatEndRef = useRef(null);
            
            // Updated Quick Chips as requested
            const quickChips = ["Education?", "Freelance?", "Strength?", "Weakness?", "MBTI?"];

            // Improved auto-scroll to avoid page jumping (using 'nearest' block)
            useEffect(() => {
                chatEndRef.current?.scrollIntoView({ behavior: "smooth", block: "nearest" });
            }, [messages, isTyping]);

            // Answered by the Matcher Module (js/matcher.js).

            // NOTE (honest scope): the Matcher reads the static knowledgeBase only.
            // Live project titles from the backend are intentionally out of scope here.
            const handleSend = (txt) => {
                const text = txt || input;
                if (!text.trim()) return;
                setMessages(prev => [...prev, { sender: 'user', text }]);
                setInput("");
                setIsTyping(true);
                
                // Simulate network/processing delay
                setTimeout(() => {
                    const response = findAnswer(text);
                    setMessages(prev => [...prev, { sender: 'bot', text: response }]);
                    setIsTyping(false);
                }, 800);
            };

            return (
                <section id="about" className="py-20 bg-void relative z-10">
                    <div className="max-w-7xl mx-auto px-6 grid md:grid-cols-2 gap-16 items-center">
                        <div>
                            <div className="flex items-center gap-4 mb-6">
                                <div className="w-12 h-1 bg-cyan-400"></div>
                                <h2 className="text-cyan-400 font-mono tracking-wide uppercase">About Me</h2>
                            </div>
                            <h3 className="text-4xl font-heading font-bold mb-6">{t.about.title}</h3>
                            <p className="text-neutral-400 text-lg mb-8 leading-relaxed">
                                Reading traditional bio can be boring. So, I built this interactive chat to give you instant answers about my background.
                            </p>
                        </div>
                        
                        {/* Terminal Window with Enhanced Soft Border & Shadow */}
                        <div className="glass-panel rounded-lg overflow-hidden flex flex-col h-[500px] border border-cyan-500/30 shadow-[0_0_20px_rgba(0,240,255,0.15)] relative transition-all duration-300 hover:shadow-neon">
                            
                            {/* Terminal Header - Updated with Cyan Robot Icon */}
                            <div className="bg-neutral-900 p-3 border-b border-white/10 flex items-center justify-between">
                                <div className="flex items-center gap-2">
                                    <div className="w-3 h-3 rounded-full bg-red-500"></div>
                                    <div className="w-3 h-3 rounded-full bg-yellow-500"></div>
                                    <div className="w-3 h-3 rounded-full bg-green-500"></div>
                                </div>
                                <div className="flex items-center gap-2 ml-4">
                                    {/* Icon Robot added here */}
                                    <Icon name="bot" size={18} className="text-cyan-400 animate-pulse" />
                                    <span className="font-mono text-xs text-cyan-400 tracking-wide font-bold">diki_assistant</span>
                                </div>
                                <div className="w-10"></div> {/* Spacer for centering */}
                            </div>

                            <div className="flex-1 p-6 overflow-y-auto space-y-4 font-mono text-sm">
                                {messages.map((msg, idx) => (
                                    <div key={idx} className={`flex ${msg.sender === 'user' ? 'justify-end' : 'justify-start'}`}>
                                        <div className={`max-w-[80%] p-3 rounded-md ${msg.sender === 'user' 
                                            ? 'bg-cyan-400/10 border border-cyan-400 text-cyan-400' 
                                            : 'bg-steel text-white border border-transparent'}`}>
                                            {msg.text}
                                        </div>
                                    </div>
                                ))}
                                {isTyping && <div className="text-neutral-500 animate-pulse" aria-live="polite">Typing...</div>}
                                <div ref={chatEndRef}></div>
                            </div>
                            <div className="p-3 bg-neutral-900/50 flex gap-2 overflow-x-auto border-t border-white/5 no-scrollbar">
                                {quickChips.map((chip, idx) => (
                                    <button key={idx} onClick={() => handleSend(chip)} className="whitespace-nowrap px-3 py-1 bg-white/5 border border-white/10 rounded-full text-xs font-mono hover:bg-cyan-400 hover:text-void transition-colors">
                                        {chip}
                                    </button>
                                ))}
                            </div>
                            <div className="p-4 bg-neutral-900 border-t border-white/10 flex gap-2">
                                <input 
                                    id="chat-input" aria-label="Ask about Diki"
                                    type="text" value={input} onChange={(e) => setInput(e.target.value)} onKeyPress={(e) => e.key === 'Enter' && handleSend()} 
                                    placeholder="Type a command…" className="flex-1 bg-transparent border-none outline-none font-mono text-sm text-white placeholder-neutral-600"
                                />
                                <button onClick={() => handleSend()} aria-label="Send message" className="text-cyan-400"><Icon name="send" size={18} /></button>
                            </div>
                        </div>
                    </div>
                </section>
            );
        };

        const CertModal = ({ isOpen, onClose, cert }) => {
            useEffect(() => {
                if (!isOpen) return;
                const onKey = (e) => { if (e.key === 'Escape') onClose(); };
                window.addEventListener('keydown', onKey);
                return () => window.removeEventListener('keydown', onKey);
            }, [isOpen, onClose]);
            if (!isOpen || !cert) return null;
            return (
                <div className="fixed inset-0 z-[100] flex items-center justify-center p-4" role="dialog" aria-modal="true" aria-label={cert.title}>
                    <div className="absolute inset-0 bg-black/90 backdrop-blur-md" onClick={onClose}></div>
                    <div className="relative bg-neutral-900 border border-white/10 p-2 rounded-lg max-w-4xl w-full max-h-[90vh] flex flex-col animate-fade-up shadow-2xl">
                        <div className="flex justify-between items-center p-4 border-b border-white/10">
                            <div><h3 className="text-xl font-bold text-white">{cert.title}</h3><p className="text-cyan-400 text-sm font-mono">{cert.issuer}</p></div>
                            <button onClick={onClose} aria-label="Close certificate view" className="text-neutral-400 hover:text-white"><Icon name="x" size={24} /></button>
                        </div>
                        <div className="flex-1 overflow-hidden p-4 flex items-center justify-center bg-black">
                            <img src={cert.image} alt={cert.title} loading="lazy" decoding="async" className="max-w-full max-h-[70vh] object-contain rounded" />
                        </div>
                    </div>
                </div>
            );
        };

        // --- Showcase data hook (data deps live here, UI deps stay in the view) ---
        const useShowcaseData = () => {
            const [state, setState] = useState(() => ({ status: 'loading', source: 'seed', projects: [], certificates: [], tech: [] }));

            const loadRef = useRef(null);
            if (!loadRef.current) {
                loadRef.current = () => {
                    setState((s) => ({ ...s, status: 'loading' }));
                    Promise.all([
                        PortfolioStore.list('projects'),
                        PortfolioStore.list('certificates'),
                        PortfolioStore.list('tech_stack')
                    ]).then(([projects, certificates, tech]) => {
                        const live = projects.source === 'live' && certificates.source === 'live' && tech.source === 'live';
                        setState({ status: 'ready', source: live ? 'live' : 'seed', projects: projects.data, certificates: certificates.data, tech: tech.data });
                    }).catch(() => {
                        setState((s) => ({ ...s, status: 'error' }));
                    });
                };
            }

            useEffect(() => {
                loadRef.current();
                const offs = ['projects', 'certificates', 'tech_stack'].map((c) =>
                    PortfolioStore.subscribe(c, () => loadRef.current())
                );
                return () => offs.forEach((off) => off());
            }, []);

            return { projects: state.projects, certificates: state.certificates, tech: state.tech, status: state.status, source: state.source, reload: loadRef.current };
        };

        const ProjectCard = ({ project }) => {
            const [imgOk, setImgOk] = useState(true);
            return (
                <div className="group relative bg-glass border border-white/10 rounded-2xl overflow-hidden hover:border-cyan-400/50 hover:shadow-neon-strong transition-all duration-500 hover:-translate-y-2 flex flex-col h-full">
                    <div className="h-52 overflow-hidden relative">
                        <div className="absolute inset-0 bg-neutral-900/40 group-hover:bg-transparent transition-all z-10 duration-500"></div>
                        {imgOk ? (
                            <img src={project.image} alt={project.title} loading="lazy" decoding="async" onError={() => setImgOk(false)} className="w-full h-full object-cover transform group-hover:scale-110 transition-transform duration-700" />
                        ) : (
                            <div className="w-full h-full bg-neutral-800 flex items-center justify-center" role="img" aria-label={project.title}><Icon name="folder-open" size={32} className="text-neutral-600" /></div>
                        )}
                    </div>
                    <div className="p-8 flex flex-col flex-1">
                        <div className="mb-4">
                            <h3 className="text-2xl font-heading font-bold text-white group-hover:text-cyan-400 transition-colors mb-1">{project.title}</h3>
                            <p className="text-xs font-mono text-cyan-400 tracking-wider uppercase">{project.tagline}</p>
                        </div>
                        <p className="text-sm text-neutral-300 mb-6 leading-relaxed flex-1">{project.description}</p>
                        <div className="flex justify-between items-center mb-6">
                            <div className="flex flex-wrap gap-2">
                                {(project.tech || []).map(tag => <span key={tag} className="text-[10px] font-bold font-mono px-3 py-1 rounded-full bg-cyan-900/20 border border-cyan-500/20 text-cyan-300">{tag}</span>)}
                            </div>
                            {project.githubLink ? (
                                <a href={project.githubLink} target="_blank" rel="noopener noreferrer" aria-label={`Open ${project.title} on GitHub`} className="text-neutral-400 hover:text-white transition-colors">
                                    <Icon name="github" size={20} />
                                </a>
                            ) : null}
                        </div>
                    </div>
                </div>
            );
        };

        const CertCard = ({ cert, onOpen }) => {
            const [imgOk, setImgOk] = useState(true);
            return (
                <div onClick={() => onOpen(cert)} className="group relative cursor-pointer rounded-xl overflow-hidden border border-white/10 bg-neutral-900 aspect-[4/3] hover:shadow-neon hover:border-cyan-400 transition-all duration-300">
                    {imgOk ? (
                        <img src={cert.image} alt={cert.title} loading="lazy" decoding="async" onError={() => setImgOk(false)} className="w-full h-full object-cover opacity-80 group-hover:opacity-100 group-hover:scale-105 transition-all duration-500" />
                    ) : (
                        <div className="w-full h-full bg-neutral-800 flex items-center justify-center" role="img" aria-label={cert.title}><Icon name="award" size={32} className="text-neutral-600" /></div>
                    )}
                    <div className="absolute inset-0 cert-overlay flex flex-col justify-end p-6 opacity-0 group-hover:opacity-100 transition-opacity duration-300">
                        <div className="transform translate-y-4 group-hover:translate-y-0 transition-transform duration-300">
                            <h4 className="font-bold text-white text-lg leading-tight mb-1">{cert.title}</h4>
                            <div className="flex justify-between items-center text-xs font-mono text-cyan-400">
                                <span>{cert.issuer}</span><span className="bg-cyan-900/50 px-2 py-1 rounded text-white flex gap-1 items-center"><Icon name="eye" size={12} /> View</span>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const TechGrid = ({ items }) => (
            <div className="grid grid-cols-3 md:grid-cols-5 lg:grid-cols-6 gap-8 animate-fade-up px-4">
                {items.map((tech) => (
                    <div key={tech.name || tech.id} className="bg-glass border border-white/10 p-6 rounded-2xl flex flex-col items-center justify-center gap-4 hover:border-cyan-400 hover:bg-white/10 transition-all duration-300 hover:-translate-y-2 group cursor-default">
                        <i className={`${tech.icon} colored text-6xl group-hover:scale-110 transition-transform duration-300 filter grayscale group-hover:grayscale-0 opacity-70 group-hover:opacity-100`}></i>
                        <span className="font-mono text-xs text-neutral-500 group-hover:text-white transition-colors">{tech.name}</span>
                    </div>
                ))}
            </div>
        );

        const PortfolioShowcase = ({ t }) => {
            const [activeTab, setActiveTab] = useState('projects');
            const [modalOpen, setModalOpen] = useState(false);
            const [selectedCert, setSelectedCert] = useState(null);
            const { projects, certificates, tech, status, source, reload } = useShowcaseData();

            const tabs = [
                { id: 'projects', label: t.portfolio.tabs[0], icon: 'folder-open' },
                { id: 'certificates', label: t.portfolio.tabs[1], icon: 'award' },
                { id: 'stack', label: t.portfolio.tabs[2], icon: 'cpu' },
            ];
            const openCert = (cert) => { setSelectedCert(cert); setModalOpen(true); };

            const tabBody = useMemo(() => {
                if (status === 'loading' && projects.length === 0 && certificates.length === 0 && tech.length === 0) {
                    return (
                        <div aria-live="polite" className="grid md:grid-cols-3 gap-8 animate-pulse">
                            <p className="text-neutral-400 font-mono text-sm md:col-span-3 text-center">Loading projects…</p>
                            {[0, 1, 2].map((i) => <div key={i} className="h-64 rounded-2xl bg-white/5 border border-white/10"></div>)}
                        </div>
                    );
                }
                if (activeTab === 'projects') {
                    if (projects.length === 0) return <p className="text-neutral-400 text-center font-mono">No projects yet. Check back soon.</p>;
                    return (
                        <div className="grid md:grid-cols-3 gap-8 animate-fade-up">
                            {projects.map(project => <ProjectCard key={project.id} project={project} />)}
                        </div>
                    );
                }
                if (activeTab === 'certificates') {
                    return (
                        <div className="grid md:grid-cols-2 lg:grid-cols-4 gap-8 animate-fade-up">
                            {certificates.length === 0 ? (
                                <p className="text-neutral-400 text-center font-mono md:col-span-2 lg:col-span-4">No certificates yet. Check back soon.</p>
                            ) : certificates.map(cert => <CertCard key={cert.id} cert={cert} onOpen={openCert} />)}
                            <div className="rounded-xl border border-dashed border-white/10 bg-white/5 flex flex-col items-center justify-center p-6 aspect-[4/3] text-center hover:border-cyan-400/50 transition-colors group cursor-default">
                                <div className="w-12 h-12 rounded-full bg-cyan-900/20 flex items-center justify-center mb-4 group-hover:scale-110 transition-transform">
                                    <Icon name="plus" className="text-cyan-400" />
                                </div>
                                <h4 className="font-heading font-bold text-white text-lg group-hover:text-cyan-400 transition-colors">{t.portfolio.more}</h4>
                                <p className="text-xs font-mono text-neutral-500 mt-2">{t.portfolio.moreSub}</p>
                            </div>
                        </div>
                    );
                }
                if (tech.length === 0) return <p className="text-neutral-400 text-center font-mono">No tech stack yet. Check back soon.</p>;
                return <TechGrid items={tech} />;
            }, [activeTab, status, projects, certificates, tech, t]);

            return (
                <section id="showcase" className="py-24 relative z-10">
                    <CertModal isOpen={modalOpen} onClose={() => setModalOpen(false)} cert={selectedCert} />
                    <div className="max-w-7xl mx-auto px-6">
                        <div className="text-center mb-16">
                            <h2 className="text-5xl font-heading font-bold mb-4 text-white drop-shadow-lg">{t.portfolio.title}</h2>
                            <p className="text-neutral-400 max-w-2xl mx-auto">{t.portfolio.subtitle}</p>
                        </div>
                        {source === 'seed' && status === 'ready' ? (
                            <p className="text-center font-mono text-xs text-neutral-500 mb-8">Showing cached content… <button onClick={reload} className="text-cyan-400 hover:underline">Try again</button></p>
                        ) : null}
                        {status === 'error' ? (
                            <p aria-live="polite" className="text-center font-mono text-sm text-red-300 mb-8">Couldn&apos;t load the showcase. Check your connection and try again. <button onClick={reload} className="text-cyan-400 hover:underline">Try again</button></p>
                        ) : null}
                        <div className="flex justify-center mb-16">
                            <div className="bg-white/5 p-1.5 rounded-2xl flex backdrop-blur-md border border-white/10 shadow-xl">
                                {tabs.map(tab => (
                                    <button key={tab.id} onClick={() => setActiveTab(tab.id)} className={`flex items-center gap-3 px-8 py-4 rounded-xl font-mono text-sm transition-all duration-300 ${activeTab === tab.id ? 'bg-gradient-to-r from-cyan-900/50 to-blue-900/50 border border-cyan-500/30 text-cyan-400 font-bold shadow-neon' : 'text-neutral-400 hover:text-white hover:bg-white/5'}`}>
                                        <Icon name={tab.icon} size={18} /> {tab.label}
                                    </button>
                                ))}
                            </div>
                        </div>
                        <div className="min-h-[400px]">
                            {tabBody}
                        </div>
                    </div>
                </section>
            );
        };

        const Contact = ({ t }) => {
            const [form, setForm] = useState({ name: '', email: '', message: '', company: '' });
            const [status, setStatus] = useState(null);
            const [error, setError] = useState(null);
            const lastSent = useRef(0);

            const openMailto = (f) => {
                const subject = `Portfolio Contact from ${f.name}`;
                const body = `Name: ${f.name}\nEmail: ${f.email}\n\nMessage:\n${f.message}`;
                window.location.href = `mailto:dikialif550@gmail.com?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                setError(null);
                if (form.company) return; // honeypot: bots pass silently, nothing happens
                if (Date.now() - lastSent.current < 30000) {
                    setStatus('error');
                    setError(t.contact.throttle);
                    return;
                }
                setStatus('sending');
                PortfolioStore.sendMessage({ name: form.name, email: form.email, message: form.message }).then(() => {
                    lastSent.current = Date.now();
                    setStatus('sent');
                    setForm({ name: '', email: '', message: '', company: '' });
                }).catch((err) => {
                    if (err && err.code === 'not-configured') {
                        openMailto(form); // backend off: honest mailto path, data kept
                        setStatus('mailto');
                        setTimeout(() => setStatus(null), 3000);
                    } else {
                        setStatus('error'); // offline/validation: message kept, never cleared
                        setError(err && err.message ? err.message : "Couldn't send. Check your connection and try again.");
                    }
                });
            };

            return (
                <section id="contact" className="py-20 bg-neutral-900 border-t border-white/5 relative z-10">
                    <div className="max-w-7xl mx-auto px-6 grid md:grid-cols-2 gap-16">
                        <div className="space-y-8">
                            <h2 className="text-4xl font-heading font-bold">{t.contact.title}<br/><span className="text-cyan-400">{t.contact.titleHigh}</span></h2>
                            <p className="text-neutral-400 text-lg">{t.contact.desc}</p>
                            <div className="space-y-4">
                                <a href="mailto:dikialif550@gmail.com" className="flex items-center gap-4 p-4 bg-white/5 rounded border border-white/5 hover:border-cyan-400 transition-all group">
                                    <div className="p-3 bg-neutral-800 rounded text-cyan-400 group-hover:shadow-neon transition-shadow"><Icon name="mail" /></div>
                                    <div><div className="text-xs text-neutral-500 uppercase font-mono">{t.contact.email}</div><div className="text-white">dikialif550@gmail.com</div></div>
                                </a>
                                <div className="flex items-center gap-4 p-4 bg-white/5 rounded border border-white/5 hover:border-cyan-400 transition-all group">
                                    <div className="p-3 bg-neutral-800 rounded text-cyan-400 group-hover:shadow-neon transition-shadow"><Icon name="map-pin" /></div>
                                    <div>
                                        <div className="text-xs text-neutral-500 uppercase font-mono">{t.contact.loc}</div>
                                        <div className="text-white flex items-center gap-3">
                                            Bandung
                                            <div className="flex items-center gap-1.5 text-cyan-400 font-mono text-xs bg-cyan-900/10 px-2 py-0.5 rounded border border-cyan-500/20">
                                                <Icon name="clock" size={12} />
                                                <span>WIB (UTC+7)</span>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <form onSubmit={handleSubmit} className="space-y-6 bg-glass p-8 rounded-lg border border-white/10">    <div className="grid md:grid-cols-2 gap-6">
                                <div className="space-y-2"><label htmlFor="contact-name" className="text-xs font-mono text-neutral-400">{t.contact.name}</label><input id="contact-name" type="text" autoComplete="name" required value={form.name} onChange={e => setForm({...form, name: e.target.value})} className="w-full bg-neutral-900 border border-white/10 rounded p-3 text-white focus:border-cyan-400 focus:outline-none focus:shadow-neon transition-all" placeholder="John Doe" /></div>
                                <div className="space-y-2"><label htmlFor="contact-email" className="text-xs font-mono text-neutral-400">{t.contact.email}</label><input id="contact-email" type="email" autoComplete="email" required value={form.email} onChange={e => setForm({...form, email: e.target.value})} className="w-full bg-neutral-900 border border-white/10 rounded p-3 text-white focus:border-cyan-400 focus:outline-none focus:shadow-neon transition-all" placeholder="john@example.com" /></div>
                            </div>
                            <div className="space-y-2"><label htmlFor="contact-message" className="text-xs font-mono text-neutral-400">{t.contact.msg}</label><textarea id="contact-message" rows="4" required value={form.message} onChange={e => setForm({...form, message: e.target.value})} className="w-full bg-neutral-900 border border-white/10 rounded p-3 text-white focus:border-cyan-400 focus:outline-none focus:shadow-neon transition-all" placeholder="Tell me about your thoughts…"></textarea></div>
                            <div aria-hidden="true" className="absolute w-px h-px overflow-hidden opacity-0"><input type="text" name="company" tabIndex="-1" autoComplete="off" value={form.company} onChange={e => setForm({...form, company: e.target.value})} /></div>
                            <button type="submit" disabled={status === 'sending'} aria-live="polite" className="w-full py-4 bg-cyan-400 text-void font-bold rounded-sm hover:shadow-neon transition-all hover:bg-cyan-500 disabled:opacity-70 flex justify-center items-center gap-2">{status === 'sending' ? t.contact.sending : status === 'mailto' ? t.contact.opening : t.contact.btn} <Icon name="arrow-right" size={18} /></button>
                            {status === 'sent' ? <p aria-live="polite" className="text-cyan-300 text-sm">{t.contact.sent}</p> : null}
                            {status === 'error' && error ? <p aria-live="polite" className="text-red-300 text-sm">{error}</p> : null}
                        </form>
                    </div>
                </section>
            );
        };

        const Footer = ({ t }) => (
            <footer className="bg-void border-t border-white/10 py-12 relative z-10">
                <div className="max-w-7xl mx-auto px-6 flex flex-col md:flex-row justify-between items-center gap-6">
                    <div className="text-center md:text-left"><div className="font-heading font-bold text-xl tracking-tighter mb-2">DAT<span className="text-cyan-400">.</span></div><p className="text-neutral-500 text-sm font-mono">{t.footer.quote}</p></div>
                    <div className="flex gap-6 text-neutral-400">
                        <a href="https://github.com/dikialiftaufik?tab=repositories" className="hover:text-cyan-400 transition-colors"><Icon name="github" /></a>
                        <a href="https://www.instagram.com/dikialif_/" className="hover:text-cyan-400 transition-colors"><Icon name="instagram" /></a>
                    </div>
                    <div className="text-neutral-600 text-xs font-mono text-center md:text-right"><p>© {new Date().getFullYear()} Diki Alif Taufik.</p><p>{t.footer.rights}</p></div>
                </div>
            </footer>
        );

        const App = () => {
            const [lang, setLang] = useState('en');
            const t = translations[lang];

            useEffect(() => { if (window.lucide) window.lucide.createIcons(); }, []);
            useEffect(() => { document.documentElement.lang = lang; }, [lang]);

            return (
                <div className="min-h-screen text-titanium relative">
                    <a href="#main" className="sr-only focus:not-sr-only focus:absolute focus:z-[200] focus:bg-cyan-400 focus:text-void focus:px-4 focus:py-2 focus:font-mono focus:text-sm">Skip to content</a>
                    <GlobalBackground />
                    <Navbar lang={lang} setLang={setLang} t={t} />
                    <main id="main">
                        <Hero t={t} />
                        <Chatbot t={t} />
                        <PortfolioShowcase t={t} />
                        <Contact t={t} />
                    </main>
                    <Footer t={t} />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
