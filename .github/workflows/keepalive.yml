name: Supabase keep-alive

# The free tier pauses a project after a week of inactivity, which silently drops the
# site to its seed fallback. A small read twice a week keeps it awake and fails loudly
# (GitHub emails the repo owner on a failed scheduled run) if the backend is unreachable.

on:
  schedule:
    - cron: '17 6 * * 1,4'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query the public projects table
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Set repository variables SUPABASE_URL and SUPABASE_ANON_KEY (public values)."; exit 1
          fi
          code=$(curl -s -o /tmp/body -w '%{http_code}' \
            "$SUPABASE_URL/rest/v1/projects?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "HTTP $code"
          test "$code" = "200"
