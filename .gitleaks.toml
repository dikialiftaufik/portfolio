title = "portfolio"

[extend]
useDefault = true

# The Supabase ANON key is public by design (it ships in every page load; row-level
# security is the access control). It is committed on purpose in .env.production.
# A service_role key must NEVER match this allowlist: only the exact anon JWT does.
[[allowlists]]
description = "Public Supabase anon key (role=anon), committed on purpose"
paths = ['''^\.env\.production$''', '''^\.env\.e2e$''']
regexes = ['''eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9\.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFreGxtbm1kZnd6ZG1zc2FpZ3FrIiwicm9sZSI6ImFub24i''']
